[workspace]
resolver = "2"
members = ["crates/idctl-protocol", "crates/idctl-usb", "crates/idctl-audio", "crates/idctl-gui"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Kerf-Audio/idctl"
authors = ["Kerf Audio"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
